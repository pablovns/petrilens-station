server.address=127.0.0.1
server.port=8080
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
server.error.include-message=never
server.error.include-stacktrace=never

spring.config.import=optional:file:./.env[.properties]
petrilens.seguranca.chave-estacao=${ESTACAO_API_KEY:}
petrilens.seguranca.usuario=${PAINEL_USUARIO:}
petrilens.seguranca.senha=${PAINEL_SENHA:}
petrilens.capturas.chave-privada=${CAPTURA_CHAVE_PRIVADA:}

# Caminho relativo ao diretório de execução, como .env (execute o JAR da raiz).
spring.datasource.url=jdbc:h2:file:./dados/petrilens
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
